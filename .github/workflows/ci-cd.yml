name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests et couverture
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Publication du rapport de couverture
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  build:
    name: Image Docker + smoke test
    needs: test
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.ref.outputs.image }}
      pushed: ${{ steps.ref.outputs.pushed }}

    env:
      PUSH: ${{ github.event_name != 'pull_request' }}

    steps:
      - uses: actions/checkout@v4

      - name: Nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Configuration Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construction de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: borne-simulator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — stack complète
        env:
          APP_IMAGE: borne-simulator:ci
        run: |
          docker compose up -d --no-build
          bash ./scripts/smoke_test.sh

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs --no-color

      - name: Arrêt de la stack
        if: always()
        run: docker compose down -v

      - name: Connexion à GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Génération des tags Docker
        id: meta
        if: env.PUSH == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publication de l'image Docker
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: true

      - name: Référence immuable de l'image
        id: ref
        env:
          IMAGE: ${{ env.IMAGE }}
          PUSH: ${{ env.PUSH }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [ "$PUSH" = "true" ]; then
            echo "image=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi
